<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio de Samuel Badjoko, développeur web passionné par la création de sites internet.">
    <title>Samuel Badjoko — Portfolio</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="wordmark" href="#accueil" aria-label="Samuel Badjoko, accueil">SB<span>.</span></a>
        <span class="header-label">Portfolio personnel</span>
    </header>

    <main id="accueil">
        <section class="hero" aria-labelledby="hero-title">
            <div class="hero-copy">
                <p class="eyebrow"><span class="status-dot" aria-hidden="true"></span> Développeur web</p>
                <h1 id="hero-title">Samuel<br><span>Badjoko.</span></h1>
                <p class="hero-description">Passionné par la création web, je donne vie aux idées à travers des sites clairs, utiles et agréables à parcourir.</p>
                <a class="contact-link" href="mailto:samuelbadjoko@gmail.com">Me contacter <span aria-hidden="true">↗</span></a>
            </div>

            <figure class="portrait">
                <img src="../image/samos1.jpg" alt="Portrait de Samuel Badjoko" fetchpriority="high">
                <figcaption>Samuel Badjoko <span>Développeur web</span></figcaption>
            </figure>
            <p class="hero-index" aria-hidden="true">01 <span>/</span> 03</p>
        </section>
    </main>

    <footer class="site-footer">
        <span>© <span data-current-year></span> Samuel Badjoko</span>
        <span>Conçu avec soin</span>
    </footer>
</body>
</html>
